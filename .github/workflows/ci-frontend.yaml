name: CI Frontend

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '26'

      - name: Install dependencies
        run: npm ci
        working-directory: frontend/webui

      - name: Type check
        run: npm run check
        working-directory: frontend/webui

      - name: Build
        run: npm run build
        working-directory: frontend/webui
        env:
          VITE_API_URL: https://placeholder.example.com