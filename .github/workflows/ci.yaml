name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore backend/CVChatbotApi/CVChatbotApi.sln

      - name: Build
        run: dotnet build backend/CVChatbotApi/CVChatbotApi.sln --no-restore

      - name: Test
        run: dotnet test backend/CVChatbotApi/CVChatbotApi.sln --no-build